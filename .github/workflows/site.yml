# Tests the SangoDiag field app and publishes it to GitHub Pages.
# Build and deploy are separate jobs: GitHub's artifact list can lag a moment after
# an upload, so deploying in the same job as the upload fails with
# "No artifacts named github-pages were found" (actions/deploy-pages#451).
# Only the files the app needs are published (no scripts/, tests/ or dev files).
name: Field app (Pages)

on:
  push:
    branches: [main]
    paths: ["mobile-app/**", "agent/triage.py", "synthetic_data/**", "examples/**", ".github/workflows/site.yml"]
  pull_request:
    paths: ["mobile-app/**", "agent/triage.py", "synthetic_data/**", "examples/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sangodiag-pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Bundle the register data
        run: python mobile-app/scripts/build_data.py
      - name: Phone rules match agent/triage.py
        run: python mobile-app/tests/make_fixtures.py && cd mobile-app && npm test

  build:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build data, icons, and stage a clean site
        run: |
          python mobile-app/scripts/build_data.py
          sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin
          cd mobile-app/icons
          rsvg-convert -w 192 -h 192 logo.svg -o icon-192.png
          rsvg-convert -w 512 -h 512 logo.svg -o icon-512.png
          rsvg-convert -w 512 -h 512 maskable.svg -o maskable-512.png
          cd ../..
          mkdir -p _site
          cp -r mobile-app/. _site/
          rm -rf _site/scripts _site/tests _site/node_modules _site/dist _site/package.json _site/package-lock.json _site/README.md _site/vercel.json _site/icons/README.md
          echo "Published files:"; find _site -type f | sort
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
      - name: Smoke test live pilot URL
        run: |
          URL="${{ steps.pages.outputs.page_url }}"
          echo "Verifying $URL"
          sleep 20   # give the Pages CDN a moment to publish
          curl -fsSL --retry 6 --retry-delay 10 --retry-all-errors "$URL" | grep -qi "<html"
          for f in sw.js js/app.js js/data.js icons/icon-192.png manifest.webmanifest; do
            curl -fsSI --retry 6 --retry-delay 10 --retry-all-errors "${URL}${f}" > /dev/null && echo "ok  ${f}"
          done
